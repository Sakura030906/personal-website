limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sakura000702.me www.sakura000702.me;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://api:8000/auth/login;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/ai/ {
        limit_req zone=ai_limit burst=15 nodelay;
        proxy_pass http://api:8000/ai/;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 90s;
    }

    location ^~ /api/ {
        proxy_pass http://api:8000/;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 90s;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:8000/uploads/;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
    }

    location ~* "\.[0-9a-f]{12}\.(?:css|js)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
