<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人网站本地编辑器</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p>Local Editor</p>
        <h1>个人网站内容编辑</h1>
      </div>
      <div class="actions">
        <a href="http://127.0.0.1:4173" target="_blank" rel="noreferrer">预览公网页面</a>
        <button type="button" data-save>保存修改</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>首页信息</h2>
        <div class="grid two">
          <label>姓名<input data-path="name" /></label>
          <label>头像字<input data-path="initials" /></label>
          <label>方向/角色<input data-path="role" /></label>
        </div>
        <label>个人简介<textarea data-path="summary" rows="4"></textarea></label>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>基本信息</h2>
          <button type="button" data-add="basicInfo">添加信息</button>
        </div>
        <div data-list="basicInfo"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>教育经历</h2>
          <button type="button" data-add="education">添加教育</button>
        </div>
        <div data-list="education"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>工作经历</h2>
          <button type="button" data-add="experience">添加工作</button>
        </div>
        <div data-list="experience"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>专业技能</h2>
          <button type="button" data-add="skills">添加技能</button>
        </div>
        <div data-list="skills"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>项目作品</h2>
          <button type="button" data-add="projects">添加项目</button>
        </div>
        <div data-list="projects"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>兴趣爱好</h2>
          <button type="button" data-add="interests">添加兴趣</button>
        </div>
        <div data-list="interests"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>博客文章</h2>
          <button type="button" data-add="blogPosts">写文章</button>
        </div>
        <div data-list="blogPosts"></div>
      </section>
    </main>

    <div class="toast" data-toast></div>
    <script src="/admin/admin.js" defer></script>
  </body>
</html>
