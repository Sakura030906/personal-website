<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="高级程序员个人网站，展示工程背景、项目经验、技术能力与联系方式。"
    />
    <meta name="theme-color" content="#f6f4ef" />
    <title>个人网站 | 高级软件工程师</title>
    <link rel="preload" href="assets/hero-workspace.png" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="回到首页">
        <span class="brand-mark" data-field="initials">SE</span>
        <span data-field="name">你的名字</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#about">关于</a>
        <a href="#projects">项目</a>
        <a href="#experience">经历</a>
        <a href="#contact">联系</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow" data-field="role">Senior Software Engineer</p>
          <h1 data-field="headline">构建稳定、清晰、长期可维护的软件系统。</h1>
          <p class="hero-summary" data-field="summary">
            专注后端系统、全栈产品交付、工程效率和可观测性。习惯从问题边界、系统设计、实现质量到上线维护完整负责。
          </p>
          <div class="contact-strip" data-links></div>
        </div>
        <aside class="profile-panel" aria-label="个人概览">
          <img src="assets/hero-workspace.png" alt="软件工程工作台" />
          <dl data-highlights></dl>
        </aside>
      </section>

      <section class="section" id="about">
        <div class="section-label">About</div>
        <div class="section-body">
          <h2>工程风格</h2>
          <div class="body-copy" data-about></div>
        </div>
      </section>

      <section class="section" id="projects">
        <div class="section-label">Projects</div>
        <div class="section-body">
          <h2>代表项目</h2>
          <div class="project-list" data-projects></div>
        </div>
      </section>

      <section class="section">
        <div class="section-label">Skills</div>
        <div class="section-body">
          <h2>技术能力</h2>
          <div class="skill-grid" data-skills></div>
        </div>
      </section>

      <section class="section" id="experience">
        <div class="section-label">Experience</div>
        <div class="section-body">
          <h2>经历</h2>
          <div class="timeline" data-experience></div>
        </div>
      </section>

      <section class="section contact" id="contact">
        <div class="section-label">Contact</div>
        <div class="section-body">
          <h2>联系</h2>
          <p data-field="contactNote">
            如果你想了解我的项目、简历或合作方式，可以通过下面的方式联系我。
          </p>
          <div class="contact-actions" data-contact-actions></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>© <span data-year></span> <span data-field="name">你的名字</span></span>
      <span>Public read-only profile</span>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
