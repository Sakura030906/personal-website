<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="晏宏翔的个人网站，记录个人介绍、技术方向、工作经历和博客文章。"
    />
    <meta name="theme-color" content="#f4f6fb" />
    <title>晏宏翔 | 个人网站</title>
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <main class="app-shell">
      <header class="site-topbar">
        <nav class="tabs" aria-label="主导航">
          <a class="tab is-active" href="#home" data-route="home">🏠 首页</a>
          <a class="tab" href="#blog" data-route="blog">📝 博客</a>
        </nav>
      </header>

      <section class="view is-active" data-view="home">
        <section class="profile-hero">
          <div class="hero-cover"></div>
          <div class="avatar" data-field="initials">晏</div>
          <div class="hero-content">
            <h1 data-field="name">晏宏翔</h1>
            <p class="role" data-field="role">大模型开发 / Agent、RAG 方向</p>
            <p class="intro" data-field="summary"></p>
          </div>
        </section>

        <section class="card-grid">
          <article class="info-card">
            <h2><span>👤</span> 基本信息</h2>
            <div class="divider"></div>
            <dl data-basic-info></dl>
          </article>

          <article class="info-card">
            <h2><span>🎓</span> 教育经历</h2>
            <div class="divider"></div>
            <div class="timeline" data-education></div>
          </article>

          <article class="info-card">
            <h2><span>💼</span> 工作经历</h2>
            <div class="divider"></div>
            <div class="timeline" data-experience></div>
          </article>

          <article class="info-card">
            <h2><span>⚡</span> 专业技能</h2>
            <div class="divider"></div>
            <div class="pill-list" data-skills></div>
          </article>

          <article class="info-card">
            <h2><span>🚀</span> 项目作品</h2>
            <div class="divider"></div>
            <div class="project-list" data-projects></div>
          </article>

          <article class="info-card">
            <h2><span>🎯</span> 兴趣爱好</h2>
            <div class="divider"></div>
            <div class="pill-list soft" data-interests></div>
          </article>
        </section>
      </section>

      <section class="view" data-view="blog">
        <div class="blog-head">
          <div>
            <p class="kicker">Writing</p>
            <h1>我的博客</h1>
          </div>
          <p>记录大模型开发、Agent、RAG、C# 工程实践和阶段性学习笔记。</p>
        </div>
        <div class="blog-list" data-blog-list></div>
        <article class="blog-article" data-blog-article hidden></article>
      </section>

      <footer class="site-footer">
        <span>© <span data-year></span> <span data-field="name">晏宏翔</span></span>
        <span>用真实经历和持续记录构建个人主页</span>
      </footer>
    </main>

    <script src="script.js?v=8" defer></script>
  </body>
</html>
