name: portfolio-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - milvus-etcd:/etcd
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_ACCESS_KEY:-milvusadmin}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_SECRET_KEY:?MILVUS_MINIO_SECRET_KEY is required}
    volumes:
      - milvus-minio:/minio_data
    networks: [backend]

  milvus:
    image: milvusdb/milvus:v2.5.14
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    depends_on: [etcd, minio]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-milvusadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY}
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [backend]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}
      UPLOAD_DIR: /app/uploads
      MILVUS_URI: http://milvus:19530
      CORS_ORIGINS: https://${DOMAIN:-sakura000702.me},https://www.${DOMAIN:-sakura000702.me}
      MAINTENANCE_STATE_FILE: /app/maintenance-state/status.json
      BACKUP_STATE_FILE: /app/backup-state/.last-success
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./data:/data:ro
      - maintenance-state:/app/maintenance-state:ro
      - backups:/app/backup-state:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: ops/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/runtime:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    networks: [frontend, backend]

  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /backups
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads:ro
      - backups:/backups
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 5m
    networks: [backend]

  maintenance:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}
      MAINTENANCE_STATE_FILE: /app/maintenance-state/status.json
    command: ["python", "-m", "scripts.maintenance_loop"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - maintenance-state:/app/maintenance-state
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.maintenance_healthcheck"]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 5m
    networks: [backend]

  certbot:
    image: certbot/certbot:v3.2.0
    profiles: ["tools"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  uploads:
  backups:
  maintenance-state:
  milvus-etcd:
  milvus-minio:
  milvus-data:
  certbot-www:
  letsencrypt:
