name: Build and release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version, for example 2026.08.01
        required: true
        type: string
      deploy:
        description: Deploy the verified images to production
        required: true
        default: false
        type: boolean
      confirmation:
        description: Enter DEPLOY when production deployment is enabled
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: crpi-sul1qi73t2e5rqq7.cn-hongkong.personal.cr.aliyuncs.com
  IMAGE_NAMESPACE: hongxiang000702

jobs:
  check:
    name: Check source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate release request
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DEPLOY_ENABLED: ${{ inputs.deploy }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$DEPLOY_ENABLED" == "true" && "$DEPLOY_CONFIRMATION" != "DEPLOY" ]]; then
            echo "Production deployment requires confirmation=DEPLOY" >&2
            exit 1
          fi
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run repository checks
        run: npm run check
      - name: Scan source, dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  build:
    name: Build, scan and publish images
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ops/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ inputs.version }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:${{ inputs.version }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push backup
        id: backup
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ops/backup/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backup:${{ inputs.version }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backup:sha-${{ github.sha }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend@${{ steps.frontend.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
        env:
          TRIVY_USERNAME: ${{ secrets.ACR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend@${{ steps.backend.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
        env:
          TRIVY_USERNAME: ${{ secrets.ACR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      - name: Scan backup image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backup@${{ steps.backup.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
        env:
          TRIVY_USERNAME: ${{ secrets.ACR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      - name: Prepare security artifacts
        run: mkdir -p security-output
      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend@${{ steps.frontend.outputs.digest }}
          format: cyclonedx
          output: security-output/frontend.cdx.json
          hide-progress: true
        env:
          TRIVY_USERNAME: ${{ secrets.ACR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend@${{ steps.backend.outputs.digest }}
          format: cyclonedx
          output: security-output/backend.cdx.json
          hide-progress: true
        env:
          TRIVY_USERNAME: ${{ secrets.ACR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      - name: Generate backup SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backup@${{ steps.backup.outputs.digest }}
          format: cyclonedx
          output: security-output/backup.cdx.json
          hide-progress: true
        env:
          TRIVY_USERNAME: ${{ secrets.ACR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      - name: Create immutable release manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          mkdir -p release-output
          {
            printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION"
            printf 'SOURCE_COMMIT=%s\n' "$GITHUB_SHA"
            printf 'FRONTEND_IMAGE=%s/%s/frontend@%s\n' "$IMAGE_REGISTRY" "$IMAGE_NAMESPACE" "$FRONTEND_DIGEST"
            printf 'FRONTEND_DIGEST=%s\n' "$FRONTEND_DIGEST"
            printf 'BACKEND_IMAGE=%s/%s/backend@%s\n' "$IMAGE_REGISTRY" "$IMAGE_NAMESPACE" "$BACKEND_DIGEST"
            printf 'BACKEND_DIGEST=%s\n' "$BACKEND_DIGEST"
            printf 'BACKUP_IMAGE=%s/%s/backup@%s\n' "$IMAGE_REGISTRY" "$IMAGE_NAMESPACE" "$BACKUP_DIGEST"
            printf 'BACKUP_DIGEST=%s\n' "$BACKUP_DIGEST"
          } > release-output/release.env
          bash ops/deploy/release.sh --plan release-output/release.env
      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.version }}
          path: release-output/release.env
          if-no-files-found: error
          retention-days: 30
      - name: Upload image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.version }}
          path: security-output/*.cdx.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Approve and deploy production
    if: ${{ inputs.deploy == true }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download immutable release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ inputs.version }}
          path: release-output
      - name: Create versioned deployment bundle
        run: |
          mkdir -p deployment-output
          bash ops/deploy/create-bundle.sh deployment-output/deploy-bundle.tar.gz
          cd deployment-output
          sha256sum deploy-bundle.tar.gz > deploy-bundle.tar.gz.sha256
      - name: Validate production configuration
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_DEPLOY_PATH: ${{ vars.SERVER_DEPLOY_PATH }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          [[ "$DEPLOY_CONFIRMATION" == "DEPLOY" ]] || {
            echo "Production deployment requires confirmation=DEPLOY" >&2
            exit 1
          }
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || {
            echo "Invalid or missing SERVER_HOST" >&2
            exit 1
          }
          [[ "$SERVER_USER" =~ ^[A-Za-z0-9_-]+$ ]] || {
            echo "Invalid or missing SERVER_USER" >&2
            exit 1
          }
          [[ "$SERVER_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "Invalid or missing SERVER_DEPLOY_PATH" >&2
            exit 1
          }
          [[ "$PUBLIC_BASE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]] || {
            echo "Invalid or missing PUBLIC_BASE_URL" >&2
            exit 1
          }
          test -f release-output/release.env
          bash ops/deploy/release.sh --plan release-output/release.env "$PUBLIC_BASE_URL"
      - name: Connect to the production tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.SERVER_HOST }}
      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          test -s "$HOME/.ssh/known_hosts"
      - name: Deploy verified release
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_DEPLOY_PATH: ${{ vars.SERVER_DEPLOY_PATH }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          remote_stage="$SERVER_DEPLOY_PATH/.deploy-incoming-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          printf -v stage_q '%q' "$remote_stage"
          ssh "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
            "umask 077; mkdir -p $stage_q"
          scp "${ssh_options[@]}" \
            release-output/release.env \
            deployment-output/deploy-bundle.tar.gz \
            deployment-output/deploy-bundle.tar.gz.sha256 \
            "$SERVER_USER@$SERVER_HOST:$remote_stage/"

          printf -v project_q '%q' "$SERVER_DEPLOY_PATH"
          printf -v base_url_q '%q' "$PUBLIC_BASE_URL"
          remote_command="set -Eeuo pipefail; cd $project_q; trap 'rm -rf $stage_q' EXIT; cd $stage_q; sha256sum -c deploy-bundle.tar.gz.sha256; cd $project_q; mkdir -p .deploy-state; tar -czf .deploy-state/config-before-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz docker-compose.prod.yml docker-compose.acr.yml ops/deploy ops/nginx 2>/dev/null || true; tar --no-same-owner -xzf $stage_q/deploy-bundle.tar.gz -C $project_q; bash ops/deploy/release.sh $stage_q/release.env $base_url_q"
          ssh "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" "$remote_command"
      - name: Verify public site
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "$PUBLIC_BASE_URL/healthz"
